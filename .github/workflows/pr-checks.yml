# PR checks — run static checks and tests on every pull request
name: pr-checks

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Terraform: formatting, init (no backend), and validation ----
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Fails if any .tf file isn't formatted; run `terraform fmt -recursive` locally to fix
      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      # -backend=false so no state access is needed; still catches provider/schema errors
      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

  # ---- Python: compile-check Glue/Lambda/scripts, run Lambda unit tests ----
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Catches syntax errors without executing anything
      - name: Compile-check Glue, Lambda, and scripts
        run: |
          FILES=$(find glue lambda scripts -name '*.py' 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "::warning::no Python files found under glue/, lambda/, scripts/"
          else
            python -m py_compile $FILES
          fi

      # Lambda unit tests live in lambda/tests (unittest discover pattern)
      - name: Run Lambda unit tests
        run: python -m unittest discover -s lambda/tests -v

  # ---- dbt: install deps and parse the project locally (duckdb, no AWS) ----
  dbt:
    name: dbt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # --target local uses duckdb so PR checks don't touch AWS/Athena
      - name: dbt parse (local target)
        working-directory: dbt
        run: dbt parse --target local

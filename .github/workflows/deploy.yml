# Deploy — applies Terraform and builds dbt marts on every push to main
#
# AUTHENTICATION: this workflow uses OIDC (aws-actions/configure-aws-credentials)
# with a role referenced by secrets.AWS_DEPLOY_ROLE_ARN. You must first create an
# IAM role in AWS that trusts GitHub's OIDC provider (token.actions.githubusercontent.com)
# for this repository, and store its ARN in the repo secret AWS_DEPLOY_ROLE_ARN.
# No long-lived AWS access keys are used.
name: deploy

on:
  push:
    branches: [main]

# OIDC requires the id-token permission; contents: read is needed for checkout
permissions:
  id-token: write
  contents: read

# One deploy at a time — a second push waits rather than racing terraform
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ---- Terraform apply: provisions/updates all AWS infrastructure ----
  terraform:
    name: terraform apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=terraform init

      # -auto-approve: main is the deploy branch; every change passed PR checks first
      - name: Terraform apply
        run: terraform -chdir=terraform apply -auto-approve

  # ---- dbt build: rebuilds business marts on Athena against the fresh infra ----
  dbt:
    name: dbt build (prod)
    runs-on: ubuntu-latest
    needs: terraform
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Glue catalog database and Athena workgroup, set from repo variables/secrets
      GLUE_DATABASE: ${{ vars.GLUE_DATABASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt Athena adapter
        run: pip install dbt-athena

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # --target prod runs against Athena using the deploy role's credentials
      - name: dbt build (prod target)
        working-directory: dbt
        run: dbt build --target prod
